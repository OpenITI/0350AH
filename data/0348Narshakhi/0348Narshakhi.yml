90#AUTH#COMMENT##: "Abu Bakr Moḥammad b. Jaʿfar Naršaḵi 
    (d. 348/959) wrote a history of Bokhara in Arabic
    for the Samanid amir Nuḥ b. Naṣr. Although the Arabic 
    text has been lost, it was abridged and translated 
    into Persian by Abu Naṣr Aḥmad Qobāwi in 522/1128, 
    with some added material to extend the chronological 
    coverage. The Persian text itself then went through 
    at least two further redactions (see Frye, p. xii; 
    Smirnova). If the received Persian text is any 
    indication of the Arabic original, it was a 
    remarkable work that preserved a wealth of fascinating 
    information about the development of Bokhara from 
    pre-Islamic to Samanid times."
    (https://www.iranicaonline.org/articles/historiography-iii/)
